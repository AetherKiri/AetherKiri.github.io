name: Deploy organization website

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync all public releases
        run: npm run sync:releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
      - name: Lint and typecheck
        run: npm run lint && npx tsc --noEmit
      - name: Test release catalog
        run: node --test tests/releases.test.mjs
      - name: Build static site
        run: npm run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
